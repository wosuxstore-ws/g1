name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds the game code. The Android wrapper is generated fresh each build.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.blockbloom --project-name block_bloom /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Brand the app (name, icon, splash, AdMob id)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then unset ADMOB_APP_ID; fi
          python3 tools/patch_android.py

      - run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Show the real error (runs only if the build failed)
        if: failure()
        run: |
          echo "=========== THE REAL ERROR ==========="
          grep -n -B3 -A30 "What went wrong" build.log | head -n 120 || tail -n 100 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBloom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
